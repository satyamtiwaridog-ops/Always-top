<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Space</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .title {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);

            color: white;
            font-family: Arial, sans-serif;
            font-size: 22px;
            letter-spacing: 5px;

            text-shadow: 0 0 15px white;

            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="title">SPACE</div>

    <canvas id="space"></canvas>


    <script>

        const canvas = document.getElementById("space");
        const ctx = canvas.getContext("2d");

        let width;
        let height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        resize();

        window.addEventListener("resize", resize);


        // -----------------------------
        // STAR SETTINGS
        // -----------------------------

        const stars = [];

        const STAR_COUNT = 1000;

        let speed = 8;

        let mouseX = 0;
        let mouseY = 0;


        // -----------------------------
        // CREATE STARS
        // -----------------------------

        function createStar(star) {

            star.x = (Math.random() - 0.5) * width;

            star.y = (Math.random() - 0.5) * height;

            star.z = Math.random() * width;

            star.pz = star.z;
        }


        for (let i = 0; i < STAR_COUNT; i++) {

            let star = {};

            createStar(star);

            stars.push(star);
        }


        // -----------------------------
        // MOUSE MOVEMENT
        // -----------------------------

        window.addEventListener("mousemove", function(e) {

            mouseX = (e.clientX - width / 2) * 0.05;

            mouseY = (e.clientY - height / 2) * 0.05;

        });


        // -----------------------------
        // TOUCH MOVEMENT
        // -----------------------------

        window.addEventListener("touchmove", function(e) {

            mouseX =
                (e.touches[0].clientX - width / 2) * 0.05;

            mouseY =
                (e.touches[0].clientY - height / 2) * 0.05;

        });


        // -----------------------------
        // DRAW SPACE
        // -----------------------------

        function draw() {

            ctx.fillStyle = "rgba(0, 0, 0, 0.35)";

            ctx.fillRect(0, 0, width, height);


            for (let star of stars) {

                // Move star toward viewer

                star.z -= speed;


                // Reset star when it reaches viewer

                if (star.z < 1) {

                    createStar(star);

                }


                // Previous position

                let sx =
                    (star.x / star.z) * width
                    + width / 2
                    + mouseX;

                let sy =
                    (star.y / star.z) * height
                    + height / 2
                    + mouseY;


                // Current position

                let px =
                    (star.x / star.pz) * width
                    + width / 2
                    + mouseX;

                let py =
                    (star.y / star.pz) * height
                    + height / 2
                    + mouseY;


                star.pz = star.z;


                // Ignore stars outside screen

                if (
                    sx < 0 ||
                    sx > width ||
                    sy < 0 ||
                    sy > height
                ) {

                    continue;

                }


                // Star size

                let size =
                    Math.max(0.5, 4 * (1 - star.z / width));


                // Draw glowing star

                ctx.beginPath();

                ctx.moveTo(px, py);

                ctx.lineTo(sx, sy);

                ctx.strokeStyle = "white";

                ctx.lineWidth = size;

                ctx.shadowBlur = 10;

                ctx.shadowColor = "white";

                ctx.stroke();

                ctx.shadowBlur = 0;

            }


            requestAnimationFrame(draw);

        }


        draw();

    </script>

</body>
</html>
