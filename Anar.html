<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Diwali Anar</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:radial-gradient(circle at center,#15102b,#02030a 70%);
}

canvas{
  display:block;
}

h1{
  position:fixed;
  top:20px;
  width:100%;
  text-align:center;
  color:white;
  font-family:Arial;
  letter-spacing:4px;
  text-shadow:0 0 15px #fff,0 0 30px #ff8a00;
}
</style>
</head>

<body>

<h1>✨ DIWALI ANAR ✨</h1>
<canvas id="canvas"></canvas>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];
let stars=[];

const ground=canvas.height-70;
const centerX=canvas.width/2;

// Stars
for(let i=0;i<150;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*1.5
  });
}

// Create fountain particles
function fountain(){

  for(let i=0;i<35;i++){

    let angle=-Math.PI/2+(Math.random()-.5)*1.25;
    let speed=Math.random()*10+7;

    particles.push({
      x:centerX+(Math.random()-0.5)*30,
      y:ground-25,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      gravity:.18,
      life:1,
      size:Math.random()*3+1,
      hue:Math.random()*60+15
    });
  }
}

function draw(){

  ctx.fillStyle="rgba(2,3,10,.20)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Stars
  stars.forEach(s=>{
    ctx.beginPath();
    ctx.fillStyle="white";
    ctx.globalAlpha=.7;
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });

  ctx.globalAlpha=1;

  // Ground
  ctx.fillStyle="#111";
  ctx.fillRect(0,ground,canvas.width,70);

  // Anar base
  let baseX=centerX;

  ctx.fillStyle="#b87924";
  ctx.beginPath();
  ctx.moveTo(baseX-45,ground);
  ctx.lineTo(baseX-35,ground-45);
  ctx.lineTo(baseX+35,ground-45);
  ctx.lineTo(baseX+45,ground);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#ffcc55";
  ctx.fillRect(baseX-28,ground-38,56,6);

  // Particles
  particles.forEach((p,i)=>{

    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=p.gravity;

    p.life-=.008;

    let color=`hsla(${p.hue},100%,60%,${p.life})`;

    ctx.beginPath();

    ctx.fillStyle=color;
    ctx.shadowBlur=18;
    ctx.shadowColor=color;

    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();

    // Spark trail
    ctx.beginPath();
    ctx.strokeStyle=color;
    ctx.lineWidth=1;
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(
      p.x-p.vx*2,
      p.y-p.vy*2
    );
    ctx.stroke();

    if(p.life<=0 || p.y>canvas.height){
      particles.splice(i,1);
    }
  });

  ctx.shadowBlur=0;

  requestAnimationFrame(draw);
}

// Continuous Diwali fountain
setInterval(fountain,70);

draw();
</script>

</body>
</html>
