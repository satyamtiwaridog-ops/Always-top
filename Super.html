<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Supernova Effect</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#000;
}

canvas{
  display:block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];
let shockwaves = [];
let stars = [];

const cx = canvas.width / 2;
const cy = canvas.height / 2;

// Background stars
for(let i=0;i<250;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*1.5,
    a:Math.random()
  });
}

function createSupernova(){

  particles = [];
  shockwaves = [];

  // Explosion particles
  for(let i=0;i<900;i++){

    let angle = Math.random()*Math.PI*2;
    let speed = Math.random()*16 + 2;

    particles.push({
      x:cx,
      y:cy,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      size:Math.random()*3+0.5,
      life:1,
      hue:Math.random()*360
    });
  }

  shockwaves.push({
    r:5,
    alpha:1
  });
}

function draw(){

  ctx.fillStyle="rgba(0,0,10,0.20)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Stars
  stars.forEach(s=>{
    ctx.beginPath();
    ctx.fillStyle=`rgba(255,255,255,${s.a})`;
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });

  // Supernova core glow
  let glow = ctx.createRadialGradient(cx,cy,0,cx,cy,180);

  glow.addColorStop(0,"white");
  glow.addColorStop(.08,"#fff");
  glow.addColorStop(.25,"#8df");
  glow.addColorStop(.5,"#8b5cff");
  glow.addColorStop(1,"transparent");

  ctx.fillStyle=glow;
  ctx.beginPath();
  ctx.arc(cx,cy,180,0,Math.PI*2);
  ctx.fill();

  // Shockwave
  shockwaves.forEach((w,i)=>{

    ctx.beginPath();
    ctx.arc(cx,cy,w.r,0,Math.PI*2);

    ctx.strokeStyle=`rgba(130,220,255,${w.alpha})`;
    ctx.lineWidth=5;

    ctx.shadowBlur=30;
    ctx.shadowColor="#7df";

    ctx.stroke();

    w.r += 18;
    w.alpha -= .012;

    if(w.alpha<=0){
      shockwaves.splice(i,1);
    }
  });

  // Particles
  particles.forEach((p,i)=>{

    p.x += p.vx;
    p.y += p.vy;

    p.vx *= 1.005;
    p.vy *= 1.005;

    p.life -= .002;

    let color=`hsla(${p.hue},100%,65%,${p.life})`;

    ctx.beginPath();

    ctx.fillStyle=color;
    ctx.shadowBlur=20;
    ctx.shadowColor=color;

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    if(p.life<=0){
      particles.splice(i,1);
    }
  });

  ctx.shadowBlur=0;

  requestAnimationFrame(draw);
}

canvas.addEventListener("click",createSupernova);

createSupernova();
draw();

// Automatic explosion every 5 seconds
setInterval(createSupernova,5000);

</script>

</body>
</html>
